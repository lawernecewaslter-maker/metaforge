name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: ["work", "main", "master"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Build EXE
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --name MetaForgeTradeAI desktop\ui_app.py

      - name: Prepare artifact bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist\MetaForgeTradeAI.exe release\MetaForgeTradeAI.exe
          Copy-Item README.md release\README.md
          Compress-Archive -Path release\* -DestinationPath MetaForgeTradeAI-win64.zip -Force

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: MetaForgeTradeAI-win64
          path: MetaForgeTradeAI-win64.zip

      - name: Upload raw EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: MetaForgeTradeAI-exe
          path: dist\MetaForgeTradeAI.exe
