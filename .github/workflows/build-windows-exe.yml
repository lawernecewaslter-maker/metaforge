name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: ["work", "main", "master"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Build EXE via integrated engine
        run: python -m desktop.build_cli --output-dir release

      - name: Prepare artifact bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release_bundle | Out-Null
          Copy-Item release\MetaForgeTradeAI.exe release_bundle\MetaForgeTradeAI.exe
          Copy-Item README.md release_bundle\README.md
          Compress-Archive -Path release_bundle\* -DestinationPath MetaForgeTradeAI-win64.zip -Force

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: MetaForgeTradeAI-win64
          path: MetaForgeTradeAI-win64.zip

      - name: Upload raw EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: MetaForgeTradeAI-exe
          path: release\MetaForgeTradeAI.exe
